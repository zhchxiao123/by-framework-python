[project]
name = "by-framework-model-openai"
version = "0.1.0.dev0"
description = "OpenAI-compatible model provider for by-framework"
requires-python = ">=3.12"
dependencies = ["by-framework>=0.2.2.dev10"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0", "pylint>=3.0.0"]

[tool.uv.sources]
by-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/by_framework_model_openai"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../src"]
testpaths = ["tests"]

